<!DOCTYPE html>

<html lang="es">

    <head>


        <!-- -------------CONFIGURACION CABECERA--------------->
        <meta charset="utf-8">
        <title>Murdoku - Inicio de Sersion</title>

        <!-- -------------EJECUTAR JAVASCRIPT------------------>
        
        <script type="text/javascript" src="js/jquery_4.0.0.js"></script>
        <script type="module" src="js/scriptQuery_index.js"></script>
		


        <!-- ------------- TITULO DE LA PAGINA -------------->
        <title>TITULO</title>
		
		<!--//AÑADIDOS ESTILOS DE CSS -->
		<link rel="stylesheet" href="./css/style.css">


    </head>

    <body>
        <main class="login-card">
                <!-- Contenedor del Logo superior -->
                <div class="logo-container">
                    <img src="img/logo.jpg" alt="Logo BIRTdoku">
                </div>

                <h1>Iniciar sesión</h1>
                <p class="subtitle">Ingresa tus datos para continuar</p>

                <form>
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="username" placeholder="Usuario" required><br><br>
                    
                    <label for="peso">Contraseña:</label>
                    <input type="password" id="password" placeholder="Contraseña" required><br><br>
                    <button type="button" id="btn-login" class="btn">Login</button>
                </form>

                <p id="mensaje-estado"></p>
            </main>
 

    

        <hr>
    </body>

</html>
